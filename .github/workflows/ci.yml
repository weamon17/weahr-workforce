name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm ci --prefix mail-server
      # Lint, unit tests, backend syntax checks, mail-server tests and build.
      - run: npm run check
        env:
          # The build only needs placeholder Firebase web config values.
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: demo-weahr.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: demo-weahr
          VITE_FIREBASE_APP_ID: ci-placeholder
      # Security rules against the Firestore emulator.
      - run: npm run test:rules
