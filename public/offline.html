<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <title>WeaHR · Mất kết nối</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #1e293b;
        background: linear-gradient(145deg, #eef2ff, #f8fafc 55%, #ecfeff);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(440px, 100%);
        padding: 32px;
        border: 1px solid #dbeafe;
        border-radius: 24px;
        background: rgba(255, 255, 255, .94);
        box-shadow: 0 24px 70px rgba(30, 41, 59, .12);
        text-align: center;
      }
      img { width: 76px; height: 76px; border-radius: 18px; }
      h1 { margin: 18px 0 8px; font-size: 1.55rem; }
      p { margin: 0; color: #64748b; line-height: 1.6; }
      button {
        width: 100%;
        margin-top: 22px;
        padding: 12px 18px;
        border: 0;
        border-radius: 12px;
        color: white;
        background: #4f46e5;
        font: inherit;
        font-weight: 750;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/wea-hr-icon.svg" alt="" />
      <h1>WeaHR đang ngoại tuyến</h1>
      <p>Hãy kiểm tra Wi-Fi hoặc dữ liệu di động. Chấm công và các thay đổi nhân sự cần kết nối để được xác thực an toàn.</p>
      <button type="button" onclick="window.location.reload()">Thử kết nối lại</button>
    </main>
  </body>
</html>
