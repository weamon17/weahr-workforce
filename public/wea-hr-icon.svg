<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>

    <!-- ── GRADIENTS ── -->

    <!-- Deep navy → indigo → violet, diagonal -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0f0c29"/>
      <stop offset="30%"  stop-color="#302b63"/>
      <stop offset="65%"  stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>

    <!-- Glass gloss on top-left -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>

    <!-- Warm amber glow at bottom — coffee warmth -->
    <radialGradient id="warmth" cx="50%" cy="100%" r="55%">
      <stop offset="0%"   stop-color="rgba(251,191,36,0.16)"/>
      <stop offset="100%" stop-color="rgba(251,191,36,0)"/>
    </radialGradient>

    <!-- Violet bloom, upper-right -->
    <radialGradient id="bloom" cx="85%" cy="15%" r="50%">
      <stop offset="0%"   stop-color="rgba(196,181,253,0.22)"/>
      <stop offset="100%" stop-color="rgba(196,181,253,0)"/>
    </radialGradient>

    <!-- Head fill: cool white with a breath of blue -->
    <radialGradient id="head-fill" cx="35%" cy="30%" r="65%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </radialGradient>

    <!-- ── FILTERS ── -->

    <!-- Soft glow behind the white mark -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Drop shadow for depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="rgba(0,0,0,0.45)"/>
    </filter>

    <!-- Clip to rounded square -->
    <clipPath id="clip">
      <rect width="100" height="100" rx="23"/>
    </clipPath>

  </defs>

  <!-- ══════════════════════════════
       BACKGROUND LAYERS
  ══════════════════════════════ -->
  <g clip-path="url(#clip)">
    <rect width="100" height="100" fill="url(#bg)"/>
    <rect width="100" height="100" fill="url(#warmth)"/>
    <rect width="100" height="100" fill="url(#bloom)"/>
    <!-- Top-left gloss panel -->
    <rect width="100" height="48" fill="url(#gloss)"/>
    <!-- Subtle inner rim -->
    <rect width="100" height="100" rx="23"
          fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="2.5"/>
  </g>

  <!-- ══════════════════════════════
       MAIN MARK — Three people forming a W

       Concept: "We Are HR"
         • 3 people (We / Human)
         • Jointly form the W (brand initial)
         • Connected through the W strokes (unity / network)
         • Coffee cup base = their shared workplace

       W junction points:
         Left peak  → (28, 22)
         Center low → (50, 52)
         Right peak → (72, 22)

       Person heads sit just above each junction,
       neck gap ≈ 1 px so they read as one figure.
  ══════════════════════════════ -->
  <g clip-path="url(#clip)">

    <!-- Subtle white glow behind entire mark -->
    <g filter="url(#glow)" opacity="0.4">
      <polyline points="14,82 28,22 50,52 72,22 86,82"
                stroke="white" stroke-width="12" fill="none"
                stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- ── W body — connecting the three figures ── -->
    <g filter="url(#shadow)">
      <polyline
        points="14,82  28,22  50,52  72,22  86,82"
        stroke="white" stroke-width="9.5" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- ── Person heads ── -->
    <!-- Left person (top-left peak) -->
    <circle cx="28" cy="13" r="7.5"
            fill="url(#head-fill)"
            stroke="rgba(167,139,250,0.55)" stroke-width="1.5"/>

    <!-- Center person (valley — the connector) -->
    <circle cx="50" cy="43" r="7.5"
            fill="url(#head-fill)"
            stroke="rgba(167,139,250,0.55)" stroke-width="1.5"/>

    <!-- Right person (top-right peak) -->
    <circle cx="72" cy="13" r="7.5"
            fill="url(#head-fill)"
            stroke="rgba(167,139,250,0.55)" stroke-width="1.5"/>

    <!-- ── Coffee cup base — shared workplace of the three ── -->
    <!-- Saucer arc below the W's outer feet -->
    <path d="M 8 88 Q 50 95 92 88"
          stroke="rgba(255,255,255,0.55)" stroke-width="3.5"
          fill="none" stroke-linecap="round"/>

    <!-- Cup handle (right) — marks this as a coffee environment -->
    <path d="M 88 81 C 98 81 98 91 88 91"
          stroke="rgba(255,255,255,0.48)" stroke-width="3.5"
          fill="none" stroke-linecap="round"/>

  </g>

  <!-- ══════════════════════════════
       ACCENT DETAILS
  ══════════════════════════════ -->
  <g clip-path="url(#clip)">

    <!-- Small halo dots above each person head — energy / presence -->
    <!-- Left halo -->
    <circle cx="28" cy="3.5" r="2" fill="rgba(255,255,255,0.52)"/>
    <!-- Center halo (sits above center figure) -->
    <circle cx="50" cy="33" r="2" fill="rgba(255,255,255,0.52)"/>
    <!-- Right halo -->
    <circle cx="72" cy="3.5" r="2" fill="rgba(255,255,255,0.52)"/>

    <!-- Tiny satellite dots — adds exclusivity / constellation feel -->
    <circle cx="18" cy="10" r="1.2" fill="rgba(255,255,255,0.3)"/>
    <circle cx="82" cy="10" r="1.2" fill="rgba(255,255,255,0.3)"/>
    <circle cx="50" cy="64" r="1.2" fill="rgba(255,255,255,0.28)"/>

  </g>

</svg>
